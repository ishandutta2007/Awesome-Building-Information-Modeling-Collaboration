<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark Architectural Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="building-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulse-node {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.4); opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      @keyframes float-particle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes dash-flow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes scan-line {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(360px); opacity: 0.2; }
      }

      .p-node { animation: pulse-node 3s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
      .p-node-2 { animation: pulse-node 4s infinite ease-in-out 1s; transform-box: fill-box; transform-origin: center; }
      .particle { animation: float-particle 5s infinite ease-in-out; }
      .particle-delay { animation: float-particle 6s infinite ease-in-out 2s; }
      .flow-line { stroke-dasharray: 8 6; animation: dash-flow 20s linear infinite; }
      .scanner { animation: scan-line 8s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Blueprint Grid Background -->
  <g opacity="0.15">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" stroke="#38bdf8" stroke-width="1" />
    <path d="M 120 0 L 120 360 M 240 0 L 240 360 M 360 0 L 360 360 M 480 0 L 480 360 M 600 0 L 600 360 M 720 0 L 720 360 M 840 0 L 840 360 M 960 0 L 960 360 M 1080 0 L 1080 360" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Dynamic Isometric 3D BIM Wireframe Structure (Positioned safely on Right Side) -->
  <g transform="translate(820, 60)" opacity="0.85">
    <!-- Building Block 1 -->
    <path d="M 100 200 L 220 140 L 220 30 L 100 90 Z" fill="url(#building-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 220 140 L 320 190 L 320 80 L 220 30 Z" fill="url(#building-grad)" stroke="#818cf8" stroke-width="1.5" opacity="0.8" />
    <path d="M 100 90 L 220 30 L 320 80 L 200 140 Z" fill="#38bdf8" opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />

    <!-- BIM Floor Slabs -->
    <path d="M 100 160 L 220 100 L 320 150" fill="none" stroke="#38bdf8" stroke-width="1.2" class="flow-line" />
    <path d="M 100 125 L 220 65 L 320 115" fill="none" stroke="#818cf8" stroke-width="1.2" class="flow-line" />

    <!-- Building Block 2 (Tower Back) -->
    <path d="M 30 150 L 120 100 L 120 10 L 30 60 Z" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 4" />
    <path d="M 120 100 L 190 135 L 190 45 L 120 10 Z" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Animated Data Nodes (BIM Clash & Issue Pins) -->
    <circle cx="100" cy="90" r="5" fill="#38bdf8" class="p-node" />
    <circle cx="220" cy="30" r="6" fill="#818cf8" class="p-node-2" />
    <circle cx="320" cy="80" r="5" fill="#c084fc" class="p-node" />
    <circle cx="220" cy="140" r="7" fill="#f43f5e" class="p-node-2" filter="url(#glow)" />
    <circle cx="160" cy="115" r="4" fill="#34d399" class="p-node" />

    <!-- Floating Connectivity Particles -->
    <circle cx="50" cy="40" r="3" fill="#38bdf8" class="particle" />
    <circle cx="260" cy="210" r="4" fill="#818cf8" class="particle-delay" />
    <circle cx="150" cy="220" r="3" fill="#c084fc" class="particle" />
  </g>

  <!-- Foreground Title and Subtitle Area (Left-Aligned & Fully Protected from Background Graphics) -->
  <g transform="translate(70, 0)">
    <!-- Header Tag/Badge -->
    <g transform="translate(0, 75)">
      <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="15" cy="15" r="5" fill="#34d399" class="p-node" />
      <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">AEC &amp; OPENBIM HUB</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">
      Awesome BIM Collaboration
    </text>

    <!-- Subtitle -->
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Curated SaaS Platforms &amp; Open-Source Tools for CDE, IFC, BCF &amp; 3D Model Coordination
    </text>

    <!-- Dynamic Tech Pills -->
    <g transform="translate(0, 245)">
      <!-- Pill 1: OpenBIM -->
      <rect x="0" y="0" width="105" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="52" y="20" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">🏗️ OpenBIM</text>

      <!-- Pill 2: IFC / BCF -->
      <rect x="117" y="0" width="115" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="174" y="20" font-family="sans-serif" font-size="13" font-weight="600" fill="#818cf8" text-anchor="middle">📐 IFC 4 &amp; BCF</text>

      <!-- Pill 3: CDE Hub -->
      <rect x="244" y="0" width="115" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="301" y="20" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">☁️ CDE Cloud</text>

      <!-- Pill 4: WebGPU 3D -->
      <rect x="371" y="0" width="125" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="433" y="20" font-family="sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">⚡ WebGPU 3D</text>
    </g>
  </g>
</svg>
